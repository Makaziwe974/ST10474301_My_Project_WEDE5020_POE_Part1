<!DOCTYPE html><!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width",
    initial-scale="1.0">

    <title>Frozen Trust |Enquiry</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <img src="images/Frozen Trust.jpg" alt="Frozen Trust" class="logo">

        <h1>Order/Enquire Now</h1>
    </header>

    <nav>

        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Products & Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>

    </nav>

    <main>

        <section class="form section">

            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below to enquire about our
                products, services, and bulk supply.
            </p>

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"required>

                <label for="service">What are you enquiring about?</label>

                <select id="service" name="service">

                    <option>2kg Ice cubes</option>
                    <option>3kg Ice cubes</option>
                    <option>Bulk Supply</option>
                    <option>Freezer Service</option>
                </select>

                <label for="message">Message:</label>

                <textarea id="message"
                name="message"
                rows="6"></textarea>

                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>
    </main>

    <footer>

        <p>Frozen Trust | 2026</p>
    </footer>
</body>
</html>
